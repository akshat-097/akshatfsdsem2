<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Checker</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f4f4f4;
        }

        .container{
            width: 350px;
            margin: auto;
            padding: 20px;
            background: brown;
            border-radius: 10px;
            box-shadow: 0px 0px 10px purple;
        }

        input{
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button{
            padding: 10px 20px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkgreen;
        }

        #result{
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Even Odd Number Checker</h2>

    <input type="number" id="num" placeholder="Enter a Number">

    <br>

    <button onclick="checkNumber()">Check</button>

    <div id="result"></div>
</div>

<script>
function checkNumber()
{
    let num = document.getElementById("num").value;

    if(num === "")
    {
        document.getElementById("result").innerHTML =
        "Please enter a number";
        return;
    }

    if(num % 2 == 0)
    {
        document.getElementById("result").innerHTML =
        num + " is an Even Number";
    }
    else
    {
        document.getElementById("result").innerHTML =
        num + " is an Odd Number";
    }
}
</script>

</body>
</html>
